# Poseidon over the Stark field for the JS SDK, as WebAssembly: starknet-crypto's
# PoseidonHasher behind a few exported functions and a fixed buffer. No
# allocator, no bindgen. Rebuild with `node sdk/scripts/build-poseidon.mjs`,
# which writes sdk/src/poseidon-wasm.mjs.
[package]
name = "arbiter_poseidon"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
starknet-crypto = { version = "=0.8.1", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
