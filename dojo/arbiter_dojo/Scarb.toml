[package]
name = "arbiter_dojo"
version = "0.1.0"
edition = "2024_07"
cairo-version = "2.13.1"
description = "Dojo binding for arbiter channels: models, events and entrypoint helpers."

[lib]

[dependencies]
arbiter = { path = "../../core" }
starknet = "2.13.1"
dojo = "1.8.0"
dojo_cairo_macros = "1.8.0"

[tool.scarb]
allow-prebuilt-plugins = ["dojo_cairo_macros"]

[dev-dependencies]
cairo_test = "2.13.1"
