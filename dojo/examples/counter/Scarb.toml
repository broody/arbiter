[package]
name = "referee_counter_dojo"
version = "0.1.0"
edition = "2024_07"
cairo-version = "2.13.1"
description = "The counter game as a Dojo world: a referee channel system in a few lines."

[[target.starknet-contract]]
sierra = true
build-external-contracts = [
    "dojo::world::world_contract::world",
    "referee_dojo::models::m_ChannelTerms",
    "referee_dojo::models::m_ChannelState",
    "referee_dojo::models::m_ProverAllowed",
    "referee_dojo::models::e_ChannelUpdated",
]

[dependencies]
referee = { path = "../../../core" }
referee_dojo = { path = "../../referee_dojo" }
referee_counter = { path = "../../../examples/counter" }
starknet = "2.13.1"
dojo = "1.8.0"
dojo_cairo_macros = "1.8.0"

[dev-dependencies]
cairo_test = "2.13.1"
dojo_cairo_test = "1.8.0"
referee_testing = { path = "../../../testing" }

[tool.scarb]
allow-prebuilt-plugins = ["dojo_cairo_macros"]
