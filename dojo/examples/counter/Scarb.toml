[package]
name = "arbiter_counter_dojo"
version = "0.1.0"
edition = "2024_07"
cairo-version = "2.13.1"
description = "The counter game as a Dojo world: an arbiter channel system in a few lines."

[[target.starknet-contract]]
sierra = true
build-external-contracts = [
    "dojo::world::world_contract::world",
    "arbiter_dojo::models::m_ChannelTerms",
    "arbiter_dojo::models::m_ChannelState",
    "arbiter_dojo::models::m_ChannelRng",
    "arbiter_dojo::models::m_ProverAllowed",
    "arbiter_dojo::models::e_ChannelUpdated",
]

[dependencies]
arbiter = { path = "../../../core" }
arbiter_dojo = { path = "../../arbiter_dojo" }
arbiter_counter = { path = "../../../examples/counter" }
starknet = "2.13.1"
dojo = "1.8.0"
dojo_cairo_macros = "1.8.0"

[dev-dependencies]
cairo_test = "2.13.1"
dojo_cairo_test = "1.8.0"
arbiter_testing = { path = "../../../testing" }

[tool.scarb]
allow-prebuilt-plugins = ["dojo_cairo_macros"]
